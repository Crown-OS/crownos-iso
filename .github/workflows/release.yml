# Builds the ISO from the latest release of every repository in components.txt,
# installs it unattended in QEMU with no network and boots the result. A pushed
# tag then signs it, uploads it to the SourceForge project under the tag's name,
# makes it the project's default download, which is what the website's download
# button serves, and publishes that tag's GitHub release with the signature,
# checksums and a download link: GitHub caps release files at 2 GiB, which the
# ISO is over. A manual run or a component's update only builds and tests.
#
# Secrets:
#   CROWNOS_SOURCES_TOKEN          read access to component releases, if any repository is private
#   CROWNOS_ISO_SIGNING_KEY        armored private key that signs the ISO
#   CROWNOS_ISO_SIGNING_PASSPHRASE its passphrase, if it has one
#   CROWNOS_SOURCEFORGE_SSH_KEY    private SSH key added to the SourceForge account that uploads
#   CROWNOS_SOURCEFORGE_API_KEY    that account's Release API key
# Variables:
#   CROWNOS_REPO_KEY               armored public key of the CrownOS package repository
#   CROWNOS_SOURCEFORGE_USER       that account's username

name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:
  repository_dispatch:
    types: [component-updated]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # The host's preinstalled SDKs, mounted so they can be deleted: the build
      # needs the space for the image, its work tree and the offline mirror.
      options: >-
        --privileged
        -v /usr/share/dotnet:/host/dotnet
        -v /usr/local/lib/android:/host/android
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/toolcache/*
      - name: Toolchain
        run: pacman -Syu --noconfirm --needed archiso base-devel github-cli git sudo gtk-update-icon-cache
      - name: Trust CachyOS packages
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Crown-OS/crownos-icon-theme
          path: crownos-icon-theme
      - name: Build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build ISO
        env:
          GH_TOKEN: ${{ secrets.CROWNOS_SOURCES_TOKEN || github.token }}
          REPO_KEY: ${{ vars.CROWNOS_REPO_KEY }}
        run: |
          key_args=()
          if [ -n "$REPO_KEY" ]; then
            printf '%s\n' "$REPO_KEY" > /tmp/crownos-archive-keyring.asc
            key_args=(--repo-key /tmp/crownos-archive-keyring.asc)
          fi
          sudo -u builder -H --preserve-env=GH_TOKEN scripts/build.sh \
            --icon-theme "$GITHUB_WORKSPACE/crownos-icon-theme" "${key_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*.iso
          compression-level: 0
          retention-days: 7

  install-test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    steps:
      - name: Toolchain
        run: pacman -Syu --noconfirm --needed qemu-base edk2-ovmf dosfstools libarchive
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - name: Install and boot
        run: scripts/install-test.sh out/*.iso
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-logs
          path: target/install-test/*.log

  publish:
    needs: install-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SOURCEFORGE_PROJECT: crownos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.CROWNOS_ISO_SIGNING_KEY }}
          CROWNOS_SIGNING_PASSPHRASE: ${{ secrets.CROWNOS_ISO_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::CROWNOS_ISO_SIGNING_KEY is not set; releases are only published signed."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          export CROWNOS_SIGNING_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          echo "SIGNING_FINGERPRINT=$CROWNOS_SIGNING_KEY" >> "$GITHUB_ENV"
          for iso in out/*.iso; do scripts/sign.sh "$iso"; done
      - name: Upload to SourceForge
        env:
          SSH_KEY: ${{ secrets.CROWNOS_SOURCEFORGE_SSH_KEY }}
          API_KEY: ${{ secrets.CROWNOS_SOURCEFORGE_API_KEY }}
          SOURCEFORGE_USER: ${{ vars.CROWNOS_SOURCEFORGE_USER }}
          FRS_HOST_KEY: frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC
        working-directory: out
        run: |
          for setting in SSH_KEY API_KEY SOURCEFORGE_USER; do
            if [ -z "${!setting}" ]; then
              echo "::error::$setting is not set; see the settings this workflow lists at the top."
              exit 1
            fi
          done
          ssh_dir=$(mktemp -d)
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$FRS_HOST_KEY" > "$ssh_dir/known_hosts"
          iso=$(ls *.iso)
          sha256sum -- *.iso > SHA256SUMS
          rsync --archive --partial \
            -e "ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts" \
            -- "$iso" "$iso.sig" "$iso.sha256" \
            "$SOURCEFORGE_USER@frs.sourceforge.net:/home/frs/project/$SOURCEFORGE_PROJECT/$GITHUB_REF_NAME/"
          echo "ISO=$iso" >> "$GITHUB_ENV"
          echo "ISO_URL=https://downloads.sourceforge.net/project/$SOURCEFORGE_PROJECT/$GITHUB_REF_NAME/$iso" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          iso=$(ls *.iso)
          notes=$(printf 'Download: [%s](%s)\n\nSigned with the CrownOS ISO key `%s`. To verify:\n\n```sh\ngpg --recv-keys %s\ngpg --verify %s.sig %s\n```\n' \
            "$iso" "$ISO_URL" "$SIGNING_FINGERPRINT" "$SIGNING_FINGERPRINT" "$iso" "$iso")
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes "$notes" --generate-notes -- *.sig *.sha256 SHA256SUMS
      # SourceForge indexes an upload a few minutes after it lands and turns the
      # Release API away until then, so this retries until the project's best
      # release is the new ISO.
      - name: Make it the default download
        env:
          API_KEY: ${{ secrets.CROWNOS_SOURCEFORGE_API_KEY }}
        run: |
          project_url="https://sourceforge.net/projects/$SOURCEFORGE_PROJECT"
          for _ in $(seq 20); do
            curl --silent --show-error -X PUT -H 'Accept: application/json' \
              -d 'default=windows&default=mac&default=linux&default=bsd&default=solaris&default=others' \
              --data-urlencode "api_key=$API_KEY" "$project_url/files/$GITHUB_REF_NAME/$ISO" || true
            if curl --silent --show-error "$project_url/best_release.json" | grep -qF "/$GITHUB_REF_NAME/$ISO"; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::SourceForge did not make $ISO the default download; set it under Files on $project_url."
          exit 1
