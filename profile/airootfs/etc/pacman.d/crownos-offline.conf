# The packages bundled on this image, for crownos-installer's pacstrap. Signature
# checks are off because the ISO itself is signed and archiso verifies the image.

[options]
Architecture = x86_64 x86_64_v3
CacheDir = /var/cache/crownos/mirror/
SigLevel = Never

[crownos-offline]
Server = file:///var/cache/crownos/mirror/
