<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
