# NOTE: this entry only serves the normal live-ISO boot (booting the built
# ISO from a USB stick). The staged install flow does NOT pass through
# systemd-boot at all: crownos-windows-installer writes a one-shot UEFI NVRAM
# entry that loads the staged vmlinuz via its EFI stub and supplies the whole
# kernel command line itself (archisobasedir=, archisodevice=/dev/disk/by-partuuid/...,
# copytoram=y, auto_install=, oobe_file=, crownos.stage=1). See CLAUDE.md for
# the full cmdline contract.
title    Arch Linux install medium (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50%
