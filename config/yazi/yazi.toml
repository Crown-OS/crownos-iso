# Settings below override Yazi's defaults.
# Learn more: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
wrap = "no"
max_width = 1200
max_height = 1800

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim", for = "unix" },
]
open = [
	{ run = 'xdg-open "$1"', orphan = true, desc = "Open", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = ["edit", "open"] },
	{ mime = "application/{json,toml,yaml,x-ndjson}", use = ["edit", "open"] },
	{ mime = "inode/empty", use = ["edit", "open"] },
]

[plugin]
prepend_fetchers = [
	{ url = "*", run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
